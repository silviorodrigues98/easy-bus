<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Meu Ônibus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --azul: #0b3d91; --azul-claro: #e8efff; --verde: #0b5d27; --verde-claro: #e3f6e8;
    --vermelho: #a8161a; --texto: #000; --cinza: #3d434b; --borda: #9aa3ae; --fundo: #f2f3f5;
    --base: 21px;
  }
  html { font-size: var(--base); }
  html.grande { --base: 25px; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--fundo); color: var(--texto); line-height: 1.35; -webkit-text-size-adjust: 100%; }
  .app { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 4px solid #f5a300; outline-offset: 2px; }
  button:active { transform: scale(0.98); }
  .num { font-variant-numeric: tabular-nums; }

  /* Linha escolhida */
  .btn-linha { width: 100%; min-height: 72px; text-align: left; background: #fff; border: 3px solid var(--azul); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .btn-linha .cod { background: var(--azul); color: #fff; font-weight: 900; font-size: 1.15rem; border-radius: 10px; padding: 6px 10px; flex-shrink: 0; }
  .btn-linha .nome { font-weight: 800; font-size: 1.1rem; flex: 1; min-width: 0; overflow-wrap: break-word; }
  .btn-linha .trocar { display: block; margin-top: 2px; font-size: 0.85rem; font-weight: 800; color: var(--azul); text-decoration: underline; }

  /* Cartão principal */
  .card-prox { margin-top: 18px; background: var(--verde-claro); border: 5px solid var(--verde); border-radius: 24px; padding: 20px 16px; text-align: center; }
  .card-prox .tit { font-size: 1.05rem; font-weight: 900; color: var(--verde); letter-spacing: 1px; }
  .card-prox .linha-sel { font-size: 1.05rem; font-weight: 800; margin-top: 2px; }
  .card-prox .hora { font-size: min(5.2rem, 24vw); font-weight: 900; line-height: 1.05; color: #04230f; margin: 8px 0 6px; }
  .card-prox .falta { display: inline-block; background: var(--verde); color: #fff; font-size: 1.4rem; font-weight: 900; border-radius: 14px; padding: 8px 18px; }
  .card-prox .falta.perto { background: var(--vermelho); }
  .card-prox .sai { margin-top: 16px; font-size: 1.2rem; background: #fff; border-radius: 14px; padding: 10px; border: 2px solid #9fd3b0; }
  .card-prox .sai span { display: block; font-size: 0.95rem; color: var(--cinza); font-weight: 700; }
  .card-prox .sai strong { font-weight: 900; font-size: 1.3rem; }
  .card-prox .dica { margin-top: 12px; font-size: 1.05rem; font-weight: 700; }
  .card-prox .obs { margin-top: 10px; font-size: 1rem; font-weight: 800; color: #5a3700; background: #fff1c7; border: 2px solid #e5b100; border-radius: 12px; padding: 8px 12px; }
  .card-prox .depois { margin-top: 14px; padding-top: 12px; border-top: 3px dashed #8cc9a0; font-size: 1.1rem; }
  .card-prox .depois strong { font-size: 1.5rem; font-weight: 900; }
  .card-prox.vazio { background: #fff; border-color: var(--borda); }
  .card-prox.vazio .tit { color: var(--cinza); }
  .card-prox .msg { font-size: 1.3rem; font-weight: 800; margin-top: 8px; }

  .btn-todos { margin-top: 12px; width: 100%; min-height: 64px; background: #fff; border: 3px solid var(--borda); border-radius: 16px; font-size: 1.15rem; font-weight: 900; }

  .lista { margin-top: 10px; background: #fff; border: 3px solid var(--borda); border-radius: 16px; padding: 14px; }
  .lista h3 { font-size: 1.05rem; font-weight: 900; color: var(--cinza); margin: 12px 0 8px; }
  .lista h3:first-of-type { margin-top: 4px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: 8px; }
  .h { border: 2px solid var(--borda); border-radius: 10px; padding: 8px 4px; text-align: center; font-size: 1.35rem; font-weight: 900; }
  .h small { display: block; font-size: 0.62rem; font-weight: 800; color: #5a3700; line-height: 1.15; margin-top: 2px; }
  .h.passou { color: #8a9099; border-color: #dde0e4; background: #f6f6f6; font-weight: 700; text-decoration: line-through; text-decoration-thickness: 2px; }
  .h.passou small { color: #a6abb2; text-decoration: none; }
  .h.prox { background: var(--verde); border-color: var(--verde); color: #fff; box-shadow: 0 0 0 3px #9fd3b0; }
  .h.prox small { color: #e3f6e8; }
  .legenda { font-size: 0.9rem; color: var(--cinza); margin-bottom: 4px; }


  footer { margin-top: 24px; text-align: center; font-size: 1rem; color: var(--cinza); }
  footer a { color: var(--azul); font-weight: 900; font-size: 1.2rem; text-decoration: none; display: inline-flex; align-items: center; min-height: 56px; margin-top: 6px; padding: 6px 16px; border: 3px solid var(--azul); border-radius: 14px; background: #fff; }
  footer .fonte { font-size: 0.75rem; margin-top: 14px; }

  /* Tela de escolher linha */
  .escolha { position: fixed; inset: 0; background: var(--fundo); z-index: 10; overflow-y: auto; display: none; }
  .escolha.aberta { display: block; }
  .escolha .cab { position: sticky; top: 0; background: var(--fundo); padding: 14px 16px 10px; max-width: 560px; margin: 0 auto; border-bottom: 2px solid #dde0e4; }
  .escolha .cab-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .escolha h2 { font-size: 1.3rem; font-weight: 900; }
  .escolha .voltar { background: #fff; border: 3px solid var(--borda); border-radius: 14px; min-height: 56px; padding: 6px 14px; font-weight: 900; font-size: 1rem; }
  .busca { width: 100%; font-size: 1.25rem; min-height: 60px; padding: 12px 14px; border: 3px solid var(--azul); border-radius: 14px; background: #fff; }
  .ajuda { font-size: 0.95rem; color: var(--cinza); margin-top: 6px; }
  .opcoes { max-width: 560px; margin: 0 auto; padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 10px; }
  .opcoes .sub { font-size: 1rem; font-weight: 900; color: var(--cinza); margin: 8px 0 0 2px; }
  .opcao { width: 100%; min-height: 64px; text-align: left; background: #fff; border: 3px solid var(--borda); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
  .opcao .cod { background: var(--azul-claro); color: var(--azul); font-weight: 900; border-radius: 8px; padding: 4px 8px; flex-shrink: 0; min-width: 3.4rem; text-align: center; }
  .opcao .nome { font-weight: 800; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
  .nada { text-align: center; color: var(--cinza); padding: 20px; font-size: 1.1rem; }

  
</style>
</head>
<body>
<div class="app">
  <button class="btn-linha" onclick="abrirEscolha()" aria-label="Trocar de linha">
    <span class="cod" id="linha-cod">--</span>
    <span class="nome"><span id="linha-nome">Toque para escolher sua linha</span><span class="trocar">Toque para trocar de linha</span></span>
  </button>

  <section class="card-prox" id="card-prox" aria-live="polite"></section>

  <button class="btn-todos" id="btn-todos" onclick="alternarTodos()">📋 Ver todos os horários de hoje</button>
  <div class="lista" id="lista" hidden></div>


  <footer>
    Dúvidas? Ligue para a Floramar:<br>
    <a href="tel:+553537299000">📞 (35) 3729-9000</a>
    <p class="fonte">App não oficial. Horários conferidos no site floramar.com.br em 07/10/2026.</p>
  </footer>
</div>

<div class="escolha" id="escolha" role="dialog" aria-label="Escolher linha">
  <div class="cab">
    <div class="cab-linha">
      <h2>Qual é a sua linha?</h2>
      <button class="voltar" onclick="fecharEscolha()">← Voltar</button>
    </div>
    <input class="busca" id="busca" type="search" placeholder="Nome do bairro ou número" oninput="montarOpcoes()" autocomplete="off" enterkeyhint="search">
    <p class="ajuda">Digite só um pedaço, por exemplo: <b>rosalia</b>, <b>kennedy</b> ou <b>225</b>.</p>
  </div>
  <div class="opcoes" id="opcoes"></div>
</div>

const NOME_DIA = { semana: 'dia de semana', sabado: 'sábado', domingo: 'domingo ou feriado' };
const SEMANA = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
let linhaId = null;
let diaManual = null;
let todosAberto = false;

function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function ler(k, padrao) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }

function tipoDia(data) { const d = data.getDay(); return d === 0 ? 'domingo' : d === 6 ? 'sabado' : 'semana'; }
function hojeStr(data) { return data.getFullYear() + '-' + (data.getMonth() + 1) + '-' + data.getDate(); }
function diaHoje(agora) { return diaManual || tipoDia(agora); }
function minutos(h) { const [a, b] = h.split(':').map(Number); return a * 60 + b; }
function hhmm(min) { min = (min + 1440) % 1440; return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
function semAcento(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/\bsanta\b/g, 'sta').replace(/\bjardim\b/g, 'jd').replace(/\bparque\b/g, 'pq').replace(/[^a-z0-9 ]/g, ' '); }
function linhaAtual() { return LINHAS.find(l => l.id === linhaId); }
function obs(l, dia, h) { return (l.observacoes && l.observacoes[dia] && l.observacoes[dia][h]) || ''; }
function nomeCurto(l) { return l.nomeDisplay.replace(/^\S+ - /, '').replace(/\s*\/\s*Est(ação|\.)?\s*Central$/i, ''); }

function textoFalta(min) {
  if (min <= 0) return 'Saindo agora!';
  if (min < 60) return `Faltam ${min} minuto${min === 1 ? '' : 's'}`;
  const h = Math.floor(min / 60), m = min % 60;
  return `Faltam ${h} hora${h > 1 ? 's' : ''}` + (m ? ` e ${m} min` : '');
}

function proximos(l, agora) {
  const dia = diaHoje(agora);
  const agoraMin = agora.getHours() * 60 + agora.getMinutes();
  const hoje = (l.horarios[dia] || []).filter(h => minutos(h) >= agoraMin);
  if (hoje.length) return { lista: hoje, dia, quando: null };
  for (let i = 1; i <= 7; i++) {
    const d = new Date(agora); d.setDate(d.getDate() + i);
    const td = tipoDia(d);
    if ((l.horarios[td] || []).length) return { lista: l.horarios[td], dia: td, quando: i === 1 ? 'amanhã' : SEMANA[d.getDay()] };
  }
  return { lista: [], dia, quando: null };
}

// De onde sai aquele horário (algumas viagens saem do bairro ou de outro ponto)
function saida(l, dia, h) {
  const o = obs(l, dia, h);
  const m = o.match(/(?:Saindo da|Saindo do|Saída|Partindo da|Partindo do)\s+([^+·]+)/i);
  if (m && !/centro/i.test(m[1])) return { local: m[1].trim(), resto: '' };
  if (/bairro → centro|Começa no bairro|Inicio no bairro|Início no bairro/i.test(o)) return { local: l.destino + ' (bairro)', resto: o.replace(/Começa no bairro/i, '').replace(/^\s*[·+]\s*/, '').trim() };
  return { local: l.origem, resto: o };
}

function calcular(l, agora) {
  const p = proximos(l, agora);
  if (!p.lista.length) return null;
  const doPonto = p.lista.filter(x => saida(l, p.dia, x).local === l.origem);
  const principal = doPonto.length ? doPonto : p.lista;
  const h = principal[0];
  const agoraMin = agora.getHours() * 60 + agora.getMinutes();
  const sd = saida(l, p.dia, h);
  return {
    p, h, sd,
    falta: p.quando ? null : minutos(h) - agoraMin,
    depois: principal.slice(1).filter(x => saida(l, p.dia, x).local === sd.local).slice(0, 2),
    outra: p.lista.find(x => minutos(x) < minutos(h) && saida(l, p.dia, x).local !== sd.local)
  };
}

function render() {
  const agora = new Date();
  const dia = diaHoje(agora);

  const l = linhaAtual();
  const card = document.getElementById('card-prox');
  document.getElementById('btn-todos').hidden = !l;
  document.getElementById('linha-cod').textContent = l ? l.codigo : '--';
  document.getElementById('linha-nome').textContent = l ? nomeCurto(l) : 'Toque para escolher sua linha';
  if (!l) {
    card.className = 'card-prox vazio';
    card.innerHTML = '<p class="tit">PRÓXIMO ÔNIBUS</p><p class="msg">Toque acima para escolher sua linha 👆</p>';
    document.getElementById('lista').hidden = true;
    return;
  }

  const c = calcular(l, agora);
  if (!c) {
    card.className = 'card-prox vazio';
    card.innerHTML = '<p class="tit">PRÓXIMO ÔNIBUS</p><p class="msg">Esta linha não tem horários cadastrados.</p>';
  } else {
    const semHoje = !(l.horarios[dia] || []).length;
    const titulo = c.p.quando
      ? (semHoje ? 'ESTA LINHA NÃO RODA HOJE' : 'NÃO TEM MAIS ÔNIBUS HOJE') + `<br>PRÓXIMO: ${c.p.quando.toUpperCase()}`
      : 'PRÓXIMO ÔNIBUS';
    const chegar = c.falta !== null && c.falta > 5 ? `🚶 Esteja no ponto até as <strong class="num">${hhmm(minutos(c.h) - 5)}</strong>` : '';
    card.className = 'card-prox';
    card.innerHTML =
      `<p class="tit">${titulo}</p>
       <p class="hora num">${c.h}</p>
       ${c.falta !== null ? `<span class="falta${c.falta <= 10 ? ' perto' : ''}">${textoFalta(c.falta)}</span>` : ''}
       ${chegar ? `<p class="dica">${chegar}</p>` : ''}
       <p class="sai"><span>O ônibus sai de:</span><strong>${c.sd.local}</strong></p>
       ${c.sd.resto ? `<p class="obs">⚠️ ${c.sd.resto}</p>` : ''}
       ${c.outra ? `<p class="obs">ℹ️ Antes, às <strong class="num">${c.outra}</strong>, sai um de ${saida(l, c.p.dia, c.outra).local}</p>` : ''}
       ${c.depois.length ? `<p class="depois">Os próximos depois deste:<br><strong class="num">${c.depois.join(' &nbsp;e&nbsp; ')}</strong></p>` : ''}`;

  }

  if (todosAberto) montarLista(l, agora);
}

function montarLista(l, agora) {
  const dia = diaHoje(agora);
  const agoraMin = agora.getHours() * 60 + agora.getMinutes();
  const hs = l.horarios[dia] || [];
  const el = document.getElementById('lista');
  if (!hs.length) { el.innerHTML = `<p class="legenda">Esta linha não roda hoje (${NOME_DIA[dia]}).</p>`; return; }
  const prox = hs.find(h => minutos(h) >= agoraMin);
  const blocos = [['🌙 Madrugada', 0, 5], ['🌅 Manhã', 5, 12], ['☀️ Tarde', 12, 18], ['🌆 Noite', 18, 24]];
  el.innerHTML = `<p class="legenda">Saindo de <strong>${l.origem}</strong> · ${NOME_DIA[dia]}.<br>Riscados já passaram. Em verde, o próximo.</p>` +
    blocos.map(([nome, a, b]) => {
      const lista = hs.filter(h => { const x = parseInt(h, 10); return x >= a && x < b; });
      if (!lista.length) return '';
      return `<h3>${nome}</h3><div class="grade">` + lista.map(h => {
        const cl = h === prox ? 'h prox' : (minutos(h) < agoraMin ? 'h passou' : 'h');
        const o = obs(l, dia, h);
        return `<div class="${cl} num">${h}${o ? `<small>${o}</small>` : ''}</div>`;
      }).join('') + '</div>';
    }).join('');
}

function alternarTodos() {
  todosAberto = !todosAberto;
  document.getElementById('lista').hidden = !todosAberto;
  document.getElementById('btn-todos').textContent = todosAberto ? '✕ Esconder a lista' : '📋 Ver todos os horários de hoje';
  render();
}


function abrirEscolha() {
  document.getElementById('busca').value = '';
  montarOpcoes();
  document.getElementById('escolha').classList.add('aberta');
  document.getElementById('escolha').scrollTop = 0;
}
function fecharEscolha() { document.getElementById('escolha').classList.remove('aberta'); }

function opcaoHTML(l) {
  return `<button class="opcao" onclick="selecionar('${l.id}')"><span class="cod">${l.codigo}</span><span class="nome">${nomeCurto(l)}</span></button>`;
}
function montarOpcoes() {
  const termo = semAcento(document.getElementById('busca').value).trim();
  const el = document.getElementById('opcoes');
  if (!termo) {
    const rec = ler('recentes', []).map(id => LINHAS.find(l => l.id === id)).filter(Boolean);
    el.innerHTML = (rec.length ? '<p class="sub">Usadas por último</p>' + rec.map(opcaoHTML).join('') : '') +
      '<p class="sub">Todas as linhas</p>' + LINHAS.map(opcaoHTML).join('');
    return;
  }
  const partes = termo.split(/\s+/);
  const achadas = LINHAS.filter(l => {
    const t = semAcento(`${l.codigo} ${l.nomeDisplay} ${l.origem} ${l.via} ${l.destino}`);
    return partes.every(p => t.includes(p));
  });
  el.innerHTML = achadas.length ? achadas.map(opcaoHTML).join('') : '<p class="nada">Nenhuma linha com esse nome.<br>Tente outro pedaço do nome do bairro.</p>';
}
function selecionar(id) {
  linhaId = id;
  guardar('linha', id);
  guardar('recentes', [id, ...ler('recentes', []).filter(x => x !== id)].slice(0, 3));
  fecharEscolha();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

(function () {
  const salvo = ler('linha', null);
  if (salvo && LINHAS.some(l => l.id === salvo)) linhaId = salvo;
  guardar('diaManual', null);
  render();
  if (!linhaId) abrirEscolha();
  setInterval(render, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
})();
</script>
